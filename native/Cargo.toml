[package]
name = "l3x-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "In-process cryptography for the L3X operator: Poseidon2, the state trees, Grumpkin and Schnorr (SPEC.md §14)."

[lib]
crate-type = ["cdylib"]

[dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false, features = ["asm"] }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
rustc-hash = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
